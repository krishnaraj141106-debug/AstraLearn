{% extends 'base1.html' %}
{% load static %}
{% block xyz %}
{% if not request.session.email %}
<script>
    alert("You have to Login First");
    location.href = "/user/login/"
</script>
{% endif %}
<div class="row py-3">
    <div class="col-sm-10 mx-auto">
        <p class="h3 text-center">Software <b class="text-color1">Kit <i class="fa-solid fa-layer-group"></i></b>
        </p>
        <hr class="w-25 mx-auto" />
        <div class="row py-2">
            {% for x in softwares %}
            <!--Software Card Start-->
            <div class="col-sm-3">
                <div class="text-center shadow-lg p-4 mx-auto rounded-3">
                    <img src="/{{x.picture}}" height="100" alt="" /><br>
                    <b class="text-center">{{x.title}}</b><br>
                    <div class="text-justify">{{x.description}}</div><br>
                    <a href="/{{x.download_link}}" class="badge btn color1 p-2 rounded-pill mt-1" target="">Download <i
                            class="fa-solid fa-download"></i></a>
                </div>
            </div>
            <!--Software Card End-->
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
