{% extends 'base1.html' %}
{% load static %}
{% block xyz %}
{% if not request.session.email %}
<script>
    alert("You have to Login First");
    location.href = "/user/login/"
</script>
{% endif %}
<div class="row py-3">
    <div class="col-sm-10 mx-auto">
        <p class="h3 text-center">Upcoming <b class="text-color1">Courses <i class="fa-solid fa-graduation-cap"></i></b>
        </p>
        <hr class="w-25 mx-auto" />
        <div class="row py-2">
            {% for x in courses %}
            <!--Courses Card Start-->
            <div class="col-sm-3 my-2">
                <div class="shadow-lg mx-auto text-center p-1">
                    <a href="/student/ldetails?cid={{x.id}}&pic={{x.category_picture}}"
                        class="text-decoration-none text-dark">
                        <img src="/{{x.category_picture}}" class="img-fluid" alt="{{x.category}}" />
                        <h5 class="mt-1">{{x.category}}</h5>
                    </a>
                </div>
            </div>
            <!--Courses Card End-->
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
