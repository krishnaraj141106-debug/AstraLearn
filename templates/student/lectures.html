{% extends 'base1.html' %}
{% load static %}
{% block xyz %}
{% if not request.session.email %}
<script>
    alert("You have to Login First");
    location.href = "/user/login/"
</script>
{% endif %}
<div class="row py-3">
    <div class="col-sm-10 mx-auto">
        <p class="h3 text-center">My <b class="text-color1">Video Lectures <i class="fa-solid fa-video"></i></b></p>
        <hr class="w-25 mx-auto" />
        <div class="row py-2">
            {% for x in videos %}
            <!--Lecture Card Start-->
            <div class="col-sm-4 my-2">
                <div class="card shadow-lg mx-auto border border-0 videocard rounded-0">
                    <h5 class="text-center my-2"><a target="_blank" href="{{x.video_link}}"><iframe class="w-100"
                                height="315" src="{{x.video_link}}" title="YouTube video player" frameborder="0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                referrerpolicy="strict-origin-when-cross-origin"
                                allowfullscreen></iframe>{{x.video_title}}</a></h5>
                </div>
            </div>
            <!--Lecture Card End-->
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
