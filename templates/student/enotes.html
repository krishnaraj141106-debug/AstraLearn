{% extends 'base1.html' %}
{% load static %}
{% block xyz %}
{% if not request.session.email %}
<script>
    alert("You have to Login First");
    location.href = "/user/login/"
</script>
{% endif %}
<div class="row py-3">
    <div class="col-sm-10 mx-auto">
        <p class="h3 text-center">E- <b class="text-color1">Books <i class="fa-solid fa-book"></i></b></p>
        <hr class="w-25 mx-auto" />
        <div class="row py-2">
            {% for x in notes %}
            <!--E-Books Card Start-->
            <div class="col-sm-3">
                <div class="card shadow-lg mx-auto border border-0 p-4 rounded-3">
                    <div>
                        <i class="fa-regular fa-file-lines color4 p-2 rounded-1 fs-1"></i><br><b>{{x.title}}</b>
                    </div>
                    <span class="py-1">{{x.description}}</span>
                    <div>
                        <a href="/{{x.notes_file}}" class="badge rounded-pill color3 btn mt-2">Download <i
                                class="fa-solid fa-download"></i></a>
                    </div>
                    <div>
                        <span class="float-end badge text-dark">{{x.added_date}}</span>
                    </div>
                </div>
            </div>
            <!--E-Books Card End-->
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
